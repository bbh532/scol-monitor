name: scol-monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Loop run (about 5.5h)
        id: loop
        run: python loop_runner.py
      - name: Self rerun
        if: steps.loop.outputs.exit == '42'
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $MONITOR_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/bbh532/scol-monitor/actions/workflows/monitor.yml/dispatches \
              -d '{"ref":"main"}')
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "204" ]; then ok=1; break; fi
            sleep 30
          done
          if [ "$ok" != "1" ]; then echo "rerun dispatch failed"; exit 1; fi
