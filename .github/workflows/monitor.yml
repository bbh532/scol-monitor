name: scol-monitor
on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Run monitor
        run: python monitor_once.py
      - name: Generate board
        run: python gen_board.py
      - name: Commit progress
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "monitor: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin main
            git push
          fi
